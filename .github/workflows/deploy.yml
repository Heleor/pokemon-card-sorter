name: Build and deploy to Pages

on:
  schedule:
    - cron: '30 21 * * *'   # daily, after tcgcsv's ~20:00 UTC price update
  push:
    branches: [main]
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download latest prices and build data
        run: node refresh.mjs --force
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp public/index.html _site/
          cp data/build/cards.json data/build/meta.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
